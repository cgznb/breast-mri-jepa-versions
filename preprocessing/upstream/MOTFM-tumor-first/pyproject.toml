[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motfm"
version = "0.1.0"
description = "Medical Optimal Transport Flow Matching for medical image synthesis."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.45,<1",
    "flow_matching==1.0.10",
    "matplotlib",
    "monai_generative==0.2.3",
    "nibabel>=5.1,<6",
    "numpy==1.26.4",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3.1",
    "peft>=0.15,<1",
    "POT==0.9.7",
    "PyYAML==6.0.2",
    "pytorch-lightning==2.5.6",
    "safetensors>=0.4.3,<1",
    "scikit-image>=0.22,<1",
    "scipy>=1.10,<2",
    "tensorboard",
    "torch>=2.5",
    "tomli>=2.0.1; python_version < '3.11'",
    "transformers>=4.50,<6",
    "tqdm==4.67.1",
]

[project.scripts]
motfm-train = "trainer:main"
motfm-train-ispy2-longitudinal = "longitudinal_trainer:main"
motfm-infer = "inferer:main"
motfm-build-ispy2 = "scripts.build_ispy2_longitudinal_bundle:main"
motfm-build-ispy2-cache = "scripts.build_ispy2_roi_cache:main"
motfm-train-tumor-first = "tumor_first_trainer:main"
motfm-build-tumor-first-oof = "tumor_first_oof:main"
motfm-train-tumor-first-mri = "tumor_first_mri_trainer:main"
motfm-build-tumor-first-mask-cache = "tumor_first_mask_cache:main"
motfm-infer-tumor-first = "tumor_first_inferer:main"
motfm-infer-tumor-first-test = "tumor_first_batch_inferer:main"
motfm-infer-tumor-first-spatial-uot = "tumor_first_spatial_uot_inferer:main"
motfm-evaluate-tumor-first = "tumor_first_evaluator:main"
motfm-compare-tumor-first-spatial-uot = "tumor_first_compare_ablations:main"
motfm-build-tumor-first-uot-teacher = "tumor_first_uot_teacher:main"
motfm-train-tumor-first-spatial-uot = "tumor_first_spatial_uot_trainer:main"
motfm-build-tumor-first-spatial-uot-oof = "tumor_first_spatial_uot_oof:main"
motfm-build-tumor-first-spatial-uot-mask-cache = "tumor_first_spatial_uot_mask_cache:main"
motfm-run-tumor-first-pipeline = "tumor_first_pipeline:main"

[project.urls]
Homepage = "https://github.com/milad1378yz/MOTFM"
Repository = "https://github.com/milad1378yz/MOTFM"
Paper = "https://arxiv.org/abs/2503.00266"

[tool.setuptools]
py-modules = [
    "trainer",
    "longitudinal_trainer",
    "inferer",
    "tumor_first_trainer",
    "tumor_first_oof",
    "tumor_first_mri_trainer",
    "tumor_first_mask_cache",
    "tumor_first_inferer",
    "tumor_first_batch_inferer",
    "tumor_first_evaluator",
    "tumor_first_compare_ablations",
    "tumor_first_uot_teacher",
    "tumor_first_spatial_uot_trainer",
    "tumor_first_spatial_uot_oof",
    "tumor_first_spatial_uot_mask_cache",
    "tumor_first_spatial_uot_inferer",
    "tumor_first_pipeline",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "scripts*", "configs*", "tumor_first*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "real_cuda: opt-in real configured CUDA smoke tests",
]
