[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "symm-fm-trjepa"
version = "0.1.0"
description = "Source-only treatment-response JEPA and three-phase 3D flow matching"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy>=1.24", "PyYAML>=6"]
[project.optional-dependencies]
io = ["SimpleITK>=2.3", "nibabel>=5"]
test = ["pytest>=8"]
monai = ["monai==1.5.1"]
[project.scripts]
trjepa = "trjepa.cli:main"
[tool.setuptools.packages.find]
include = ["trjepa*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
