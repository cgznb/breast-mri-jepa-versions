[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-mri-vla-jepa"
version = "1.0.1"
description = "MRI VLA-JEPA dual-task pCR and latent-state prediction with raw and pretrained VQ encoders"
readme = "README.md"
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE", "licenses/CODEC_NOTICE.md", "licenses/CC-BY-NC-4.0.txt"]
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.24", "PyYAML>=6", "scikit-learn>=1.1"]

[project.optional-dependencies]
raw = ["nibabel>=5.2", "scipy>=1.10", "pandas>=2.0", "openpyxl>=3.1"]
test = ["pytest>=8"]

[project.scripts]
mri-vla-jepa = "mri_vla_jepa.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mri_vla_jepa = ["resources/configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
